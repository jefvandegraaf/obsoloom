<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Obsoloom controls</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font: 12px system-ui, sans-serif;
        user-select: none;
      }

      /* The same controls the camera window draws at rest, in a window of
         their own that recording never sees. Sized and placed by the main
         process to sit over the camera's centre. */
      #hud {
        width: 100%;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        opacity: 0.3;
        transition: opacity 0.12s ease;
      }

      /* Our own tooltip. A native one (the title attribute) is drawn by
         Windows in a separate top-level window, which this window's content
         protection does not cover -- so it showed up in recordings. */
      #tip {
        margin: 6px auto 0;
        width: fit-content;
        max-width: 100%;
        padding: 3px 9px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        font-size: 11px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.1s ease;
        pointer-events: none;
      }

      #tip.on {
        opacity: 1;
      }

      #hud button {
        cursor: pointer;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.6);
        transition: background 0.14s ease, filter 0.1s ease;
      }

      #hud svg {
        display: block;
        width: 17px;
        height: 17px;
        stroke: #fff;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
      }

      #hud button:hover {
        filter: brightness(1.25);
      }

      #gear:hover {
        background: rgba(0, 0, 0, 0.85);
      }

      #gear svg {
        width: 19px;
        height: 19px;
      }

      #gear svg path {
        fill: currentColor;
        stroke: none;
      }

      #gear {
        color: #fff;
      }

      /* Recording: the dot becomes a square on a white button, so the same
         control reads as Stop. */
      #rec {
        background: #e0281e;
        color: #fff;
      }

      #rec:hover {
        background: rgba(0, 0, 0, 0.85);
        color: #ff4d4d;
      }

      #rec svg circle,
      #rec svg rect {
        fill: currentColor;
        stroke: none;
      }

      body.recording #rec {
        background: #fff;
        color: #e0281e;
      }

      body.recording #rec .dot {
        display: none;
      }

      #rec .square {
        display: none;
      }

      body.recording #rec .square {
        display: block;
      }

      #quit {
        background: rgba(226, 66, 30, 0.86);
      }

      #quit:hover {
        background: rgba(226, 66, 30, 1);
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <!-- No title attributes anywhere in here: Windows draws a native
           tooltip in its own top-level window, which is not covered by this
           window's content protection and so lands in the recording. The
           label below is drawn in-page instead. -->
      <button id="rec" aria-label="Start recording" data-label="Start recording">
        <svg viewBox="0 0 24 24">
          <circle class="dot" cx="12" cy="12" r="6" />
          <rect class="square" x="7" y="7" width="10" height="10" rx="2" />
        </svg>
      </button>
      <button id="gear" aria-label="Settings" data-label="Settings">
        <svg viewBox="0 -960 960 960">
          <path
            d="M560-80q-17 0-28.5-11.5T520-120v-240q0-17 11.5-28.5T560-400h240q17 0 28.5 11.5T840-360v80l80-80v240l-80-80v80q0 17-11.5 28.5T800-80H560Zm-190 0-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v13.5H622q0-58-41-99t-99-41q-58 0-99 41t-41 99q0 48 27 84t71 50v266h-70Z"
          />
        </svg>
      </button>
      <button id="quit" aria-label="Close Obsoloom" data-label="Close">
        <svg viewBox="0 0 24 24">
          <path d="M6 6 18 18M18 6 6 18" />
        </svg>
      </button>
    </div>
    <div id="tip"></div>
    <script src="hud.js"></script>
  </body>
</html>
